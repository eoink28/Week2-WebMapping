<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Map Dublin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map('map').setView([{{ dublin_lat }}, {{ dublin_lon }}], 14);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri — Source: Esri, HERE, Garmin, OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const markers = [
            { lat: 53.3438, lon: -6.2546, name: 'Trinity College Dublin', popup: 'Founded in 1592, home of the Book of Kells' },
            { lat: 53.3429, lon: -6.2674, name: 'Dublin Castle', popup: 'Seat of British rule in Ireland until 1922' },
            { lat: 53.3455, lon: -6.2644, name: 'Temple Bar', popup: 'Cobbled cultural quarter on the south bank of the Liffey' }
        ];

        markers.forEach(function(marker) {
            L.marker([marker.lat, marker.lon])
                .addTo(map)
                .bindPopup('<b>' + marker.name + '</b><br>' + marker.popup);
        });
    </script>
</body>
</html>
